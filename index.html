<!DOCTYPE html>
<html>
<head>
  <title>ARK Dino Painter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="app">
  <h1>ARK Dino Painter</h1>

  <!-- Dino Select -->
  <div class="card">
  <div class="headerlabel">Select Dino</div>
  <div class="searchable-dropdown">
    <input type="text" id="dinoInput" placeholder="Type to search..." autocomplete="off">
    <div id="dinoList" class="dropdown-content hidden"></div>
  </div>
</div>

  <!-- Regions -->
<div class="card">
  <div class="headerlabel">Regions</div>
  <div id="regions" class="regions-grid"></div>
  <div class="button-row">
<button class="primary" onclick="randomizeColors()"><span class="emoji">🎲 </span>Randomize</button>
<button class="primary" onclick="smartRandomize()"><span class="emoji">🧠 </span>Smart Randomize</button>
    <div class="preset-container">
    <div id="presetSelectFake" class="preset-display">Presets ▼</div>
    <div id="presetDropdown" class="preset-dropdown hidden"></div>
  </div>
</div>
<div class="button-row">
<button class="subtle" id="resetPreset"><span class="emoji">⟲ </span>Reset</button>
<button class="subtle" onclick="copyShareLink()"><span class="emoji">🔗 </span>Share</button>
</div>
</div>

  <div class="card canvas-card">
    <div id="dinoTitle" class="dino-title"></div>
    <canvas id="canvas" width="512" height="512"></canvas>
  </div>

  <!-- Admin -->
  <div class="card">
    <div class="headerlabel">Admin Command</div>

    <div class="admin-wrapper">
      <textarea id="adminCommand" readonly></textarea>
      <button class="copy-btn" onclick="copyCommand()">📋</button>
    </div>

    <div class="button-row">
      <button class="subtle" id="modeSimple">Colour Command</button>
      <button class="subtle" id="modeFull">Spawn Command</button>
    </div>
  </div>
</br></br>
  <div class="card ad-banner hidden" id="adBanner">
    <a id="adLink" href="#" target="_blank" rel="noopener">
      <img id="adImage" src="" alt="Server Advertisement">
    </a>
  </div>
  <div class="ad-cta">
  <button class="subtle" onclick="openAdForm()">
    📢 Want to Advertise Your Server? <span class="flip">📢</span>
  </button>
</div>

</div>

<script src="data/colors.js"></script>
<script src="data/dinos.js"></script>
<script src="data/presets.js"></script>
<script src="ads/ads.js"></script>
<script src="script.js"></script>
  
</body>
</html>
