# Cloudflare Pages configuration.
# The static site is served from the repo root; API code lives in functions/.
name = "dinopainter"
compatibility_date = "2025-09-01"
pages_build_output_dir = "."

# D1 database binding. The Pages dashboard binding must use the variable name "DB".
[[d1_databases]]
binding = "DB"
database_name = "dinopainter"
database_id = "8d266c6a-4ac2-4264-8448-ce0b6c2c6642"

# Secrets (do NOT put values here) — set them with:
#   npx wrangler pages secret put IP_SALT
#   npx wrangler pages secret put ADMIN_TOKEN
# IP_SALT     - any long random string; salts hashed IPs used for rate limiting
# ADMIN_TOKEN - long random string; bearer token for /api/admin/* and admin.html
